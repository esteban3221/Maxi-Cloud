version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: maxicajero_db_local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: maxicajero_cloud
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
